steps:
  - label: "Run Python in Docker"
    key: "sentence-step"
    plugins:
      docker#v3.8.0:
        image: "python:3.13"
        mount-buildkite-agent: true
        volumes:
          - ".:/app"
        workdir: /app
        command:
          - "sh"
          - "-c"
          - "pip install . && python -c 'from loremipsum import sentence; print(sentence(max_char=20))' > result.txt"
    artifact_paths:
      - result.txt

  - label: "Run paragraph if sentence passes"
    depends_on: "sentence-step"
    plugins:
      docker#v3.8.0:
        image: "python:3.13"
        mount-buildkite-agent: true
        volumes:
          - ".:/app"
        workdir: /app
        command:
          - "sh"
          - "-c"
          - "pip install . && python -c 'from loremipsum import paragraph; open(\"result.txt\", \"w\").write(paragraph(max_char=100))'"
    artifact_paths:
      - result.txt
